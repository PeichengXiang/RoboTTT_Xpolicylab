[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robottt-reproduction"
version = "0.1.0"
description = "Paper-guided RoboTTT methods reproduction with a local training and rollout harness"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.5"]

[project.optional-dependencies]
isaac-export = ["h5py>=3.8"]

[tool.setuptools.packages.find]
include = ["robottt*"]
